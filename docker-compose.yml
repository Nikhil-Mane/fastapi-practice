version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: jobqueue-postgres
    environment:
      POSTGRES_DB: asyncjobqueue
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d asyncjobqueue"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jobqueue-network

  # Redis for caching and rate limiting
  redis:
    image: redis:7-alpine
    container_name: jobqueue-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jobqueue-network

  # Main FastAPI Application
  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: jobqueue-app
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:password@postgres:5432/asyncjobqueue
      - REDIS_URL=redis://redis:6379/0
      - DEBUG=false
      - LOG_LEVEL=INFO
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - jobqueue-network
    restart: unless-stopped

  # Task Generator Microservice
  task-generator:
    build:
      context: .
      dockerfile: Dockerfile.task-generator
    container_name: jobqueue-task-generator
    environment:
      - TASK_PROCESSOR_URL=http://app:8000
      - DATABASE_URL=postgresql+asyncpg://postgres:password@postgres:5432/taskgenerator
      - REDIS_URL=redis://redis:6379/0
      - DEBUG=false
      - LOG_LEVEL=INFO
      - GENERATION_INTERVAL=5
      - MAX_CONCURRENT_TASKS=10
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - jobqueue-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - app

volumes:
  postgres_data:

networks:
  jobqueue-network:
    driver: bridge 